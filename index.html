<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="dark-mode">

    <div class="qb-app d-flex vh-100 overflow-hidden w-100">

        <aside class="qb-sidebar d-none d-md-flex flex-column justify-content-between p-3">
            <div>
                <div class="qb-brand d-flex align-items-center justify-content-between mb-3 px-1">
                    <div class="d-flex align-items-center gap-2">
                        <span class="qb-logo-badge"><i class="fa-solid fa-bolt"></i></span>
                        <span class="fw-bold fs-5">QuickBot</span>
                    </div>
                    <button type="button" class="btn btn-sm qb-icon-btn" onclick="toggleTheme()" title="Toggle Theme">
                        <i class="fa-solid fa-sun" id="themeIcon"></i>
                    </button>
                </div>

                <button type="button" class="btn qb-new-chat-btn w-100 mb-3 py-2 px-3 rounded-3 d-flex align-items-center justify-content-between" onclick="createNewChat()">
                    <span><i class="fa-solid fa-plus me-2"></i>New Chat</span>
                    <kbd class="qb-kbd">Reset</kbd>
                </button>

                <div class="small text-uppercase fw-semibold qb-section-label px-2 mb-2">Session</div>
                <div class="qb-session-box p-3 rounded-3 small">
                    <div class="fw-semibold mb-1"><i class="fa-regular fa-circle-dot text-success me-2"></i>Live Session</div>
                    <div class="qb-muted">Temporary run mode</div>
                </div>
            </div>

            <div class="qb-sidebar-footer pt-3 mt-2 border-top d-flex align-items-center justify-content-between px-1">
                <div class="d-flex align-items-center gap-2">
                    <div class="qb-avatar-sm rounded-circle d-flex align-items-center justify-content-center fw-bold">Q</div>
                    <div class="small fw-semibold">Quick User</div>
                </div>
            </div>
        </aside>

        <main class="qb-main flex-grow-1 d-flex flex-column position-relative">

            <header class="qb-topbar d-flex align-items-center justify-content-between px-3 px-md-4 py-3 border-bottom">
                <div class="d-flex align-items-center gap-2">
                    <span class="qb-status-dot"></span>
                    <h5 class="m-0 fw-bold">QuickBot</h5>
                    <span class="badge qb-pill rounded-pill d-none d-sm-inline-block">Chat & Photo Clean</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm qb-icon-btn px-2" onclick="toggleApiKeyBox()" title="Set API Key">
                        <i class="fa-solid fa-key me-1"></i>API Key
                    </button>
                    <button type="button" class="btn btn-sm qb-icon-btn d-md-none" onclick="toggleTheme()" title="Toggle Theme">
                        <i class="fa-solid fa-sun" id="mobileThemeIcon"></i>
                    </button>
                    <button type="button" class="btn btn-sm qb-icon-btn d-md-none" onclick="createNewChat()" title="New Chat">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </header>

            <div class="px-3 px-md-4 py-2 border-bottom" id="apiKeyBar" style="display: none; background-color: var(--qb-surface-2);">
                <div class="qb-chat-inner mx-auto w-100 d-flex align-items-center gap-2">
                    <input type="password" id="txtRuntimeApiKey" class="form-control form-control-sm" placeholder="Paste Gemini API Key here...">
                    <button type="button" class="btn btn-sm btn-primary" onclick="saveRuntimeApiKey()">Apply</button>
                </div>
            </div>

            <div class="qb-chat-scroll flex-grow-1 overflow-auto px-3 px-md-4 py-4 d-flex flex-column justify-content-end" id="chatBox">
                <div class="qb-chat-inner mx-auto w-100" id="chatWrapper"></div>
            </div>

            <div class="qb-attachment-bar px-3 px-md-4" id="imagePreviewBar" style="display: none;">
                <div class="qb-chat-inner mx-auto w-100">
                    <div class="qb-preview-card d-inline-flex align-items-center gap-3 p-2 rounded-3 mb-2">
                        <img id="selectedImageThumb" src="" alt="Selected preview" class="qb-thumb rounded-2">
                        <div class="small">
                            <div class="fw-semibold" id="selectedImageName">photo.png</div>
                            <div class="qb-muted">Type a clean/edit prompt and press Send</div>
                        </div>
                        <button type="button" class="btn btn-sm text-danger ms-2" onclick="clearSelectedImage()" title="Remove Image">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>

            

    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.10/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
    <script src="config.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
